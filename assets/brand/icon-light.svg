<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Learning thermostat icon">
  <defs>
    <clipPath id="clip">
      <rect x="20" y="20" width="216" height="216" rx="34" ry="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="20" y="20" width="216" height="216" rx="34" ry="34" fill="#184E77"/>

    <!-- Spine -->
    <rect x="20" y="20" width="52" height="216" fill="#103A5C"/>
    <rect x="72" y="20" width="4" height="216" fill="#0B2A42" opacity="0.32"/>

    <!-- Book page/base accent kept geometric and bold -->
    <path d="M86 184 H214 Q214 184 214 184 Q214 184 214 202 Q214 220 196 220 H96 Q84 220 82 210 Q80 204 80 198 Q80 184 86 184 Z" fill="#F1E9DB"/>

    <!-- Simple spine bands for book readability -->
    <path d="M20 58 Q46 48 72 58 V72 Q46 64 20 74 Z" fill="#2A6A99" opacity="0.75"/>
    <path d="M20 174 Q46 164 72 174 V188 Q46 180 20 190 Z" fill="#2A6A99" opacity="0.75"/>

    <!-- Thermometer embedded in cover -->
    <g>
      <rect x="123" y="54" width="18" height="88" rx="9" fill="#E9775D"/>
      <circle cx="132" cy="154" r="26" fill="#E9775D"/>
    </g>
  </g>
</svg>