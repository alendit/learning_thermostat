[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-thermostat"
version = "0.1.0"
description = "Standalone Home Assistant learning thermostat integration"
readme = "README.md"
requires-python = ">=3.13.2,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "black>=25.1.0",
  "numpy>=2.2.0",
  "pytest==9.0.0",
  "pytest-homeassistant-custom-component==0.13.316",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
